services:
  postgres:
    image: postgres:17
    container_name: traderlock-postgres
    environment:
      POSTGRES_USER: traderlock
      POSTGRES_PASSWORD: traderlock
      POSTGRES_DB: traderlock_dev
    ports:
      - "5432:5432"
    volumes:
      - traderlock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderlock -d traderlock_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17
    container_name: traderlock-postgres-test
    environment:
      POSTGRES_USER: traderlock
      POSTGRES_PASSWORD: traderlock
      POSTGRES_DB: traderlock_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderlock -d traderlock_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  traderlock_postgres_data:
